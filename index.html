<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>机器人日报</title><style>
*{box-sizing:border-box}html{background:#f4f6f8;color:#202a35}
body{max-width:52rem;margin:auto;padding:2rem 1.25rem;font:17px/1.85 system-ui,-apple-system,sans-serif;overflow-wrap:anywhere}
article{background:white;border:1px solid #e0e5ea;border-radius:14px;padding:2rem}

code{background:#f1f4f6;padding:.1em .25em;border-radius:3px}pre code{padding:0}table{width:100%;border-collapse:collapse;font-size:.88rem;table-layout:fixed}

.math-display{display:block;max-width:100%;overflow:auto;padding:.8rem .3rem;background:#f7f9fb;border-radius:8px}

</style></head><body><h1>机器人日报</h1><p>情报 · 论文 · 公开精读与比较</p><select id="kind"><option value="">全部栏目</option><option>intel</option><option>paper</option><option>deep_read</option><option>comparison</option></select><input id="q" placeholder="中文关键词"><main id="results"></main><p>运行快照：可接收QQ消息；检查于2026-10-06T17:43:25.771563+08:00。仅代表该次检查，停机期间页面不更新。</p><aside>运行异常记录（历史保留）：runtime:production runtime_service_failed；intel:2026-10-03 unknown</aside><script>fetch('search.json').then(r=>r.json()).then(items=>{const q=document.querySelector('#q'),kind=document.querySelector('#kind'),out=document.querySelector('#results');function draw(){out.replaceChildren();items.filter(x=>(!kind.value||x.kind===kind.value)&&(x.title+x.summary).includes(q.value)).forEach(x=>{let p=document.createElement('p'),a=document.createElement('a');a.href=x.url;a.textContent=x.date+' · '+x.kind+' · '+x.title;p.append(a);out.append(p)})}q.oninput=draw;kind.onchange=draw;draw()})</script></body></html>
