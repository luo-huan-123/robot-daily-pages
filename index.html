<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>机器人日报</title><style>body{max-width:48rem;margin:auto;padding:1rem;font:18px/1.75 system-ui;color:#20242a}a{overflow-wrap:anywhere}pre{white-space:pre-wrap}aside{background:#eee;padding:1rem}small{color:#555}</style><body><h1>机器人日报</h1><p>情报 · 论文 · 公开精读与比较</p><select id="kind"><option value="">全部栏目</option><option>intel</option><option>paper</option><option>deep_read</option><option>comparison</option></select><input id="q" placeholder="中文关键词"><main id="results"></main><aside>intel:2026-10-03 unknown</aside><script>fetch('search.json').then(r=>r.json()).then(items=>{const q=document.querySelector('#q'),kind=document.querySelector('#kind'),out=document.querySelector('#results');function draw(){out.replaceChildren();items.filter(x=>(!kind.value||x.kind===kind.value)&&(x.title+x.summary).includes(q.value)).forEach(x=>{let p=document.createElement('p'),a=document.createElement('a');a.href=x.url;a.textContent=x.date+' · '+x.kind+' · '+x.title;p.append(a);out.append(p)})}q.oninput=draw;kind.onchange=draw;draw()})</script></body></html>
